name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  analyze-and-test:
    name: 代码检查和测试
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true
      
      - name: 安装依赖
        working-directory: frontend
        run: flutter pub get
      
      - name: 代码分析
        working-directory: frontend
        run: flutter analyze
      
      - name: 运行单元测试
        working-directory: frontend
        run: flutter test
      
      - name: 检查代码格式
        working-directory: frontend
        run: dart format --set-exit-if-changed .
